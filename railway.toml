[project]
name = "readium-cli"

[build]
# Use your fork of the Readium CLI repo (update with your GitHub username).
# Example: source = "https://github.com/YOUR_USERNAME/cli.git"
source = "https://github.com/FPMedia/readium-cli"

[deploy]
# Dockerfile deploys run the start command instead of ENTRYPOINT.
# This command is the same script: it binds 0.0.0.0:$PORT and reads R2_*.
# A different start command that does not listen on $PORT returns 502.
startCommand = "/bin/sh /opt/railway-serve.sh"
healthcheckPath = "/health"
healthcheckTimeout = 120
